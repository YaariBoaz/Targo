<div class="user-header">
  <!-- Avatar (Left) -->
  <div class="avatar-container" (click)="onAvatarClick()">
    @if (avatarUrl) {
      <img [src]="avatarUrl" alt="User Avatar" class="avatar" />
    } @else {
      <div class="avatar-placeholder">
        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="28" fill="rgba(255, 255, 255, 0.1)" />
          <circle cx="30" cy="25" r="10" fill="rgba(255, 255, 255, 0.3)" />
          <path d="M 10 50 Q 30 40 50 50" fill="rgba(255, 255, 255, 0.3)" />
        </svg>
      </div>
    }
  </div>

  <!-- User Info (Center) -->
  <div class="user-info">
    <p class="user-name">{{ userName }}</p>
    <div class="stats">
      <span class="stat-item">
        Score: <span class="stat-value">{{ score }}</span>
      </span>
      <span class="stat-item">
        Rank: <span class="stat-value">{{ rank }}</span>
      </span>
    </div>
  </div>

  <!-- Settings Icon (Right) -->
  <button class="settings-btn" (click)="onSettingsClick()">
    <ion-icon name="settings-outline"></ion-icon>
  </button>
</div>

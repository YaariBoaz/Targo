<div class="special-offers-section">
  <!-- Section Header -->
  <div class="section-header">
    <h2 class="section-title">SPECIAL OFFERS</h2>
  </div>

  <!-- Offer Banner -->
  <div class="offer-banner" (click)="onOfferClick()">
    <!-- Background Image (if available) -->
    @if (currentOffer.imageUrl) {
      <div class="banner-background">
        <img [src]="currentOffer.imageUrl" alt="Offer Background" />
      </div>
    }

    <!-- Gradient Overlay -->
    <div class="banner-overlay"></div>

    <!-- Content -->
    <div class="banner-content">
      <h3 class="offer-title">{{ currentOffer.title }}</h3>
      <p class="offer-description">{{ currentOffer.description }}</p>
    </div>

    <!-- Pagination Dots -->
    <div class="pagination-dots">
      @for (offer of offers; track offer.id; let i = $index) {
        <button
          class="dot"
          [class.active]="i === currentOfferIndex"
          (click)="selectOffer(i); $event.stopPropagation()"
        ></button>
      }
    </div>
  </div>
</div>

<div class="pro-purchase-panel">
  <div class="header">
    <span class="pro-badge">PRO PLAN ✅</span>
    <div class="info">You save 5% on every pack 🎯</div>
  </div>

  <div class="packs">
    <div class="pack" *ngFor="let pack of bulletPacks">
      <div class="count">{{ pack.count }} Bullets</div>
      <div class="price">
        ${{ discountedPrice(pack.price) }}
        <span class="saved">You save ${{ savedAmount(pack.price) }}</span>
      </div>
      <button (click)="buyPack(pack)" class="buy-btn">Buy</button>
    </div>
  </div>
</div>

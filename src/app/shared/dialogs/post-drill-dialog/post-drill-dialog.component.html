<div class="overlay">
  <div class="panel" [style.background-image]="'url(' + bgImage + ')'">
    <!-- Countdown progress bar -->
    <div *ngIf="shouldAutoplay" class="progress-track">
      <div class="progress-fill" [style.width.%]="progress"></div>
    </div>

    <h2>{{ headline }}</h2>
    <p>{{ subtext }}</p>

    <div *ngIf="shouldAutoplay" class="countdown-number">{{ counter }}</div>

    <div class="actions">
      <button class="primary" (click)="startNow()">Start&nbsp;Now</button>
      <button class="secondary" (click)="retry()">Retry</button>
      <button class="exit" (click)="exit()">Exit</button>
    </div>
  </div>
</div>

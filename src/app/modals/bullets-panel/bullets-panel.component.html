<div class="bullets-panel">
  <!-- Drag Handle -->
  <div class="drag-handle"></div>

  <!-- Header -->
  <div class="panel-header">
    <div>
      <h2 class="panel-title">TARGO SHOP</h2>
      <p class="panel-subtitle">Please select one of our offers:</p>
    </div>
    <div>
      <button class="close-btn" (click)="close()">
        <span>✕</span>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="panel-content">
    <!-- Subscription Cards -->
    <div class="subscription-cards">
      <!-- Yearly Plan -->
      <div class="subscription-card" (click)="onPurchaseBullets(3650)">
        <div class="card-header">
          <div class="plan-name">Yearly Subscription</div>
          <div class="price">
            $99.99<br /><span class="best-offer"> Best Offer</span>
          </div>
        </div>
        <div class="card-body">
          <ul>
            <li>Unlimited bullets</li>
            <li>Pro insights unlocked</li>
            <li>Cancel anytime</li>
          </ul>
        </div>
      </div>

      <!-- Monthly Plan -->
      <div class="subscription-card" (click)="onPurchaseBullets(365)">
        <div class="card-header">
          <div class="plan-name">Monthly Subscription</div>
          <div class="price">$50.99</div>
        </div>
        <div class="card-body">
          <ul>
            <li>500 bullets</li>
          </ul>
        </div>
      </div>

      <!-- Daily Plan -->
      <div class="subscription-card" (click)="onPurchaseBullets(10)">
        <div class="card-header">
          <div class="plan-name">Purchase Bullets</div>
          <div class="price">$20.99</div>
        </div>
        <div class="card-body">
          <ul>
            <li>100 bullets</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

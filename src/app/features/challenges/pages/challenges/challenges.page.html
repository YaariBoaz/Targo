<div class="challenges-page">
  <div class="background-gradient"></div>

  <!-- Header -->
  <div class="challenges-header">
    <app-user-header></app-user-header>
  </div>

  <!-- Scrollable Content -->
  <div class="challenges-scroll-container">
    <div class="challenges-content">

      <!-- Loading -->
      @if (isLoading) {
        <div class="loading-state">
          <p>Loading challenges...</p>
        </div>
      }

      <!-- All Challenges -->
      @if (!isLoading) {
        <div class="challenges-list">
          @for (challenge of allChallenges; track challenge.id) {
            <div class="challenge-card" (click)="onChallengeClick(challenge)">
              <div class="challenge-image">
                <img [src]="challenge.imageUrl" [alt]="challenge.title" />
              </div>
              <div class="challenge-details">
                <h3 class="challenge-title">{{ challenge.title }}</h3>
                <p class="challenge-rank">
                  Difficulty:
                  <span
                    class="rank-value"
                    [style.color]="getDifficultyColor(challenge.difficulty)"
                  >{{ challenge.difficulty | uppercase }}</span>
                </p>
                <p class="challenge-description">{{ challenge.description }}</p>
                <button class="challenge-btn start">START</button>
              </div>
            </div>
          }

          @if (allChallenges.length === 0) {
            <div class="empty-state">
              <p>No challenges available yet.</p>
            </div>
          }
        </div>
      }

    </div>
  </div>
</div>

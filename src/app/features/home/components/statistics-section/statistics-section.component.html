<div class="statistics-section">
  <!-- Section Header -->
  <div class="section-header">
    <h2 class="section-title">STATISTICS</h2>
    <button class="see-more-btn" (click)="onSeeMore()">SEE MORE</button>
  </div>

  <!-- Loading State -->
  @if (loading) {
    <div class="loading-state">
      <p>Loading statistics...</p>
    </div>
  }

  <!-- 2x2 Grid -->
  @if (!loading) {
    <div class="stats-grid">

      <!-- Hit Ratio Card -->
      <div class="stat-card hit-ratio-card">
        <div class="chart-container">
          <app-hit-ratio-chart
            [hitRatio]="hitRatio"
            [hitRatioChange]="hitRatioChange"
          ></app-hit-ratio-chart>
        </div>
      </div>

      <!-- Avg Split Time Card -->
      <div class="stat-card trend-card">
        <div class="trend-header">
          <span class="trend-label">AVG SPLIT TIME</span>
          <div class="trend-values">
            <span class="trend-value">{{ splitTime.toFixed(2) }}s</span>
          </div>
        </div>
        <div class="mini-chart-container">
          <canvas #splitTimeChart></canvas>
        </div>
      </div>

      <!-- Avg Accuracy Card -->
      <div class="stat-card trend-card">
        <div class="trend-header">
          <span class="trend-label">AVG ACCURACY</span>
          <div class="trend-values">
            <span class="trend-value">{{ avgAccuracy.toFixed(1) }}cm</span>
          </div>
        </div>
        <div class="mini-chart-container">
          <canvas #accuracyChart></canvas>
        </div>
      </div>

      <!-- Avg Grouping Card -->
      <div class="stat-card grouping-card">
        <div class="grouping-header">
          <span class="trend-label">AVG GROUPING</span>
          <div class="trend-values">
            <span class="trend-value">{{ avgGrouping.toFixed(1) }}cm</span>
          </div>
        </div>
        <div class="radial-chart-container">
          <canvas #groupingChart></canvas>
        </div>
      </div>

    </div>
  }
</div>

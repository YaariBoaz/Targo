<div class="home-page">
  <!-- Background -->
  <div class="background-gradient"></div>

  <!-- Scrollable Content -->
  <div class="home-scroll-container">
    <div class="home-content">
      <!-- User Header -->
      <app-user-header></app-user-header>
      @if (flags.homeMultiplayerPanel) {
        <app-multiplayer-panel />
      }
      <!-- Challenges Section -->
      @if (flags.homeChallengesSection) {
        <app-challenges-section></app-challenges-section>
      }

      <!-- Special Offers -->
      @if (flags.homeSpecialOffersBanner) {
        <app-special-offers-banner></app-special-offers-banner>
      }

      <!-- Statistics Section -->
      @if (flags.homeStatisticsSection) {
        <app-statistics-section></app-statistics-section>
      }
    </div>
  </div>
</div>

<div class="settings-detail-page">
  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">
      <ion-icon name="chevron-back"></ion-icon>
      <span>BACK</span>
    </button>
    <h1 class="page-title">SETTINGS</h1>
  </div>

  <!-- Content -->
  <div class="page-content">
    <!-- User Profile Section -->
    <div class="form-section">
      <div class="form-group">
        <label for="nickname">NICKNAME</label>
        <input
          type="text"
          id="nickname"
          [(ngModel)]="nickname"
          placeholder="Enter nickname"
        />
      </div>

      <div class="form-group">
        <label for="firstName">FIRST NAME</label>
        <input
          type="text"
          id="firstName"
          [(ngModel)]="firstName"
          placeholder="Enter first name"
        />
      </div>

      <div class="form-group">
        <label for="lastName">LAST NAME</label>
        <input
          type="text"
          id="lastName"
          [(ngModel)]="lastName"
          placeholder="Enter last name"
        />
      </div>

      <div class="form-group">
        <label for="username">USERNAME</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          placeholder="Enter username"
        />
      </div>

      <div class="form-group">
        <label for="email">EMAIL</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          placeholder="Enter email"
          readonly
        />
      </div>
    </div>

    <!-- Weapon Settings Section -->
    <div class="weapon-settings-section">
      <h2 class="section-title">Weapon Settings</h2>

      <div class="form-group">
        <label class="section-label">Weapon Type</label>
        <select [(ngModel)]="weaponType" class="weapon-select">
          <option value="pistol">Pistol</option>
          <option value="rifle">Rifle</option>
          <option value="sniper">Sniper</option>
        </select>
      </div>

      <div class="form-group">
        <label class="section-label">Preferred Distance:</label>
        <input
          type="number"
          [(ngModel)]="preferredDistance"
          class="distance-input"
          min="0"
          max="1000"
        />
      </div>

      <div class="form-group">
        <label class="section-label">Target Type</label>
        <select [(ngModel)]="targetType" class="weapon-select">
          <option value="static">Static Target</option>
          <option value="moving">Moving Target</option>
          <option value="popup">Pop-up Target</option>
        </select>
      </div>
    </div>

    <!-- Save Button -->
    <button
      class="save-btn"
      (click)="onSave()"
      [disabled]="loading"
      [class.success]="saveSuccess"
    >
      {{ loading ? 'SAVING...' : saveSuccess ? 'SAVED!' : 'SAVE' }}
    </button>
  </div>
</div>

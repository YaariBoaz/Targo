<ion-content class="login-content" [fullscreen]="true">
  <!-- Background -->
  <div class="background-image"></div>
  <div class="background-overlay"></div>

  <!-- Content -->
  <div class="login-container">
    <!-- Back Button -->
    <button class="back-button" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
      <span>BACK</span>
    </button>

    <!-- Logo Section -->
    <div class="logo-section">
      <!-- Crosshair Icon -->
      <div class="crosshair-icon">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g class="outer-ring">
            <path d="M 100 20 A 80 80 0 0 1 180 100" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 180 100 A 80 80 0 0 1 100 180" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 100 180 A 80 80 0 0 1 20 100" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 20 100 A 80 80 0 0 1 100 20" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
          <g class="crosshair-lines">
            <line x1="100" y1="10" x2="100" y2="35" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="190" y1="100" x2="165" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="100" y1="190" x2="100" y2="165" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="10" y1="100" x2="35" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </g>
          <circle cx="100" cy="100" r="25" stroke="#f5a623" stroke-width="3" fill="none"/>
        </svg>
      </div>

      <!-- TARGO Text -->
      <h1 class="targo-text">TARGO</h1>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <h2 class="form-title">LOGIN TO YOUR ACCOUNT</h2>

      <form [formGroup]="loginForm">
        <!-- Email Input -->
        <div class="input-group">
          <label class="input-label">YOUR EMAIL</label>
          <input
            type="email"
            class="input-field"
            formControlName="email"
            placeholder="">
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <label class="input-label">PASSWORD</label>
          <div class="password-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="input-field"
              formControlName="password"
              placeholder="">
            <button type="button" class="toggle-password" (click)="togglePassword()">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <ion-button
          expand="block"
          class="btn-login"
          [disabled]="!loginForm.valid"
          (click)="onLogin()">
          LOGIN
        </ion-button>
      </form>

      <!-- Forgot Password Link -->
      <a class="forgot-password" (click)="forgotPassword()">FORGOT PASSWORD?</a>

      <!-- Register Link -->
      <p class="register-link">
        DON'T HAVE AN ACCOUNT?
        <a (click)="goToRegister()">REGISTER</a>
      </p>

      <!-- Continue as Guest -->
      <ion-button expand="block" fill="outline" class="btn-guest" (click)="continueAsGuest()">
        CONTINUE AS GUEST
      </ion-button>
      <p class="guest-subtitle">(No drill will be saved)</p>
    </div>
  </div>
</ion-content>

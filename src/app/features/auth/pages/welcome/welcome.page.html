<ion-content class="welcome-content" [fullscreen]="true">
  <!-- Background -->
  <div class="background-image"></div>
  <div class="background-overlay"></div>

  <!-- Content -->
  <div class="welcome-container">
    <!-- Logo & Title -->
    <div class="brand-section">
      <!-- Crosshair Icon -->
      <div class="crosshair-icon">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer broken ring (white) -->
          <g class="outer-ring">
            <path d="M 100 20 A 80 80 0 0 1 180 100" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 180 100 A 80 80 0 0 1 100 180" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 100 180 A 80 80 0 0 1 20 100" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 20 100 A 80 80 0 0 1 100 20" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
          <!-- Crosshair lines -->
          <g class="crosshair-lines">
            <line x1="100" y1="10" x2="100" y2="35" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="190" y1="100" x2="165" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="100" y1="190" x2="100" y2="165" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="10" y1="100" x2="35" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- Center circle (gold) -->
          <circle cx="100" cy="100" r="25" stroke="#f5a623" stroke-width="3" fill="none"/>
        </svg>
      </div>

      <!-- TARGO Text -->
      <h1 class="targo-text">TARGO</h1>

      <!-- Tagline -->
      <p class="tagline">TACTICAL SHOOTING TRAINER</p>
    </div>

    <!-- Buttons Section -->
    <div class="buttons-section">
      <!-- LOGIN Button -->
      <ion-button expand="block" class="btn-login" (click)="goToLogin()">
        LOGIN
      </ion-button>

      <!-- Social Login Buttons -->
      <ion-button expand="block" class="btn-facebook" (click)="loginWithFacebook()">
        <ion-icon slot="start" name="logo-facebook"></ion-icon>
        Continue with Facebook
      </ion-button>

      <ion-button expand="block" class="btn-google" (click)="loginWithGoogle()">
        <svg slot="start" class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </ion-button>

      <!-- OR Divider -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">OR</span>
        <span class="divider-line"></span>
      </div>

      <!-- REGISTER Button -->
      <ion-button expand="block" class="btn-register" (click)="goToRegister()">
        REGISTER
      </ion-button>

      <!-- CONTINUE AS GUEST Button -->
      <ion-button expand="block" fill="outline" class="btn-guest" (click)="continueAsGuest()">
        CONTINUE AS GUEST
      </ion-button>

      <!-- Guest Subtitle -->
      <p class="guest-subtitle">(No drill will be saved)</p>
    </div>
  </div>
</ion-content>

<ion-content class="forgot-password-content" [fullscreen]="true">
  <!-- Background -->
  <div class="background-image"></div>
  <div class="background-overlay"></div>

  <!-- Content -->
  <div class="forgot-password-container">
    <!-- Back Button -->
    <button class="back-button" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
      <span>BACK</span>
    </button>

    <!-- Logo Section -->
    <div class="logo-section">
      <!-- Crosshair Icon -->
      <div class="crosshair-icon">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g class="outer-ring">
            <path
              d="M 100 20 A 80 80 0 0 1 180 100"
              stroke="white"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M 180 100 A 80 80 0 0 1 100 180"
              stroke="white"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M 100 180 A 80 80 0 0 1 20 100"
              stroke="white"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M 20 100 A 80 80 0 0 1 100 20"
              stroke="white"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
          </g>
          <g class="crosshair-lines">
            <line
              x1="100"
              y1="10"
              x2="100"
              y2="35"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
            />
            <line
              x1="190"
              y1="100"
              x2="165"
              y2="100"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
            />
            <line
              x1="100"
              y1="190"
              x2="100"
              y2="165"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
            />
            <line
              x1="10"
              y1="100"
              x2="35"
              y2="100"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
            />
          </g>
          <circle
            cx="100"
            cy="100"
            r="25"
            stroke="#f5a623"
            stroke-width="3"
            fill="none"
          />
        </svg>
      </div>

      <!-- TARGO Text -->
      <h1 class="targo-text">TARGO</h1>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <h2 class="form-title">RESET YOUR PASSWORD</h2>
      <p class="form-subtitle">
        Enter your email address and we'll send you a link to reset your
        password.
      </p>

      <form [formGroup]="forgotPasswordForm">
        <!-- Email Input -->
        <div class="input-group">
          <label class="input-label">YOUR EMAIL</label>
          <input
            type="email"
            class="input-field"
            formControlName="email"
            placeholder="john.m@gmail.com"
          />
        </div>

        <!-- Reset Password Button -->
        <ion-button
          expand="block"
          class="btn-reset"
          [disabled]="!forgotPasswordForm.valid"
          (click)="onResetPassword()"
        >
          SEND RESET LINK
        </ion-button>
      </form>

      <!-- Back to Login Link -->
      <p class="back-to-login">
        REMEMBER YOUR PASSWORD?
        <a (click)="goBack()">LOGIN</a>
      </p>
    </div>
  </div>
</ion-content>

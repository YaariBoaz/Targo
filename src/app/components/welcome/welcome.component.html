<div class="welcome-screen">
  <img class="logo" src="assets/logo.png" />
  <h1 class="app-title">ON TARGET</h1>
  <h2 class="app-subtitle">TACTICAL SHOOTING TRAINER</h2>

  <button class="primary-btn" (click)="navigateTo('login')">LOGIN</button>

  <button
    type="button"
    class="login-with-google-btn"
    (click)="loginWithGoogle()"
  >
    Sign in with Google
  </button>

  <button class="facebook-btn" (click)="loginWithFacebook()">
    <svg
      class="facebook-icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="white"
      width="22px"
      height="22px"
    >
      <path
        d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 5 3.66 9.12 8.44 9.88v-6.99h-2.54V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99C18.34 21.12 22 17 22 12z"
      />
    </svg>
    <span>Continue with Facebook</span>
  </button>

  <div class="divider">OR</div>

  <button class="primary-btn" (click)="navigateTo('register')">REGISTER</button>

  <div class="guest" (click)="continueAsGuest()">
    CONTINUE AS GUEST
    <span class="description">No Date Will Be Saved!</span>
  </div>
</div>

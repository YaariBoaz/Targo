<section>
  <div class="tabs">
    <button
      *ngFor="let tab of ['all', 'earned', 'locked']"
      (click)="selectedTab = tab"
      [class.active]="selectedTab === tab"
    >
      {{ tab | titlecase }}
    </button>
  </div>

  <main class="badge-grid">
    <div
      class="badge-card"
      *ngFor="let badge of filteredBadges"
      [class.earned]="badge.done"
    >
      <div
        class="badge-card"
        *ngFor="let badge of filteredBadges"
        [class.earned]="badge.done"
      >
        <!-- Inline SVG -->
        <svg
          class="badge-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 122.88 122.88"
        >
          <path
            fill="currentColor"
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M61.44,0l13.52,10.99l17.2-2.76l6.21,16.28l16.28,6.21l-2.76,17.2l10.99,13.52l-10.99,13.52l2.76,17.2
         l-16.28,6.21l-6.21,16.28l-17.2-2.76l-13.52,10.99l-13.52-10.99l-17.2,2.76l-6.21-16.28L8.23,92.16l2.76-17.2L0,61.44l10.99-13.52
         l-2.76-17.2l16.28-6.21l6.21-16.28l17.2,2.76L61.44,0z M61.44,39.54l6.34,15.49l16.69,1.24L71.7,67.09l3.98,16.26l-14.23-8.81
         l-14.23,8.81l3.98-16.26L38.41,56.27l16.69-1.24L61.44,39.54z M61.44,26.71c19.18,0,34.73,15.55,34.73,34.73

          />

        <div class="label">{{ badge.name }}</div>
      </div>
    </div>
  </main>
</section>

<div class="drill-setup-container">
  <h2 class="title">🎯 Drill Setup</h2>

  <!-- Distance Selection -->
  <div class="section">
    <label>Distance</label>
    <div class="distance-selector">
      <div class="preset-options">
        <select>
        <option *ngFor="let option of presetDistances"
                (click)="selectDistance(option)"
                [class.selected]="selectedDistance === option">
          {{ option }}
        </option>
        </select>
      </div>
    </div>
  </div>

 <!-- Weapon Category -->
<div class="section">
  <label>Weapon Category</label>
  <div class="category-selector">
    <button [class.selected]="selectedCategory === 'Pistol'" (click)="selectCategory('Pistol')">🔫 Pistol</button>
    <button [class.selected]="selectedCategory === 'AR'" (click)="selectCategory('AR')">🔧 AR</button>
  </div>
</div>

<!-- Weapon Type -->
<div class="section">
  <label>Weapon Type</label>
  <div class="weapon-select-wrapper">
    <select [(ngModel)]="selectedWeapon" (change)="updateSelectedWeaponIcon()">
      <option *ngFor="let weapon of filteredWeapons" [ngValue]="weapon.name">
        {{ weapon.name }}
      </option>
    </select>
  </div>
</div>

  <!-- Bullet Count -->
  <div class="section">
    <label>Number of Bullets</label>
    <div class="bullet-stepper">
      <button (click)="changeBullets(-1)">−</button>
      <span>{{ bullets }}</span>
      <button (click)="changeBullets(1)">+</button>
    </div>
  </div>

  <!-- Friendly Tip -->
  <div class="tips">
    <p>💡 Tip: Choose fewer bullets for quick drills, or max out for endurance!</p>
  </div>

  <!-- Start Drill Button -->
  <div class="start-wrapper">
    <button class="start-button" (click)="startDrill()">🚀 Start Drill</button>
  </div>
</div>

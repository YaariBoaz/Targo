<div class="panel">
  <!-- Sliding track -->
  <div class="track" [style.transform]="'translateX(-' + active * 100 + '%)'">
    <div (click)="p.action()" *ngFor="let p of promotions" class="card">
      <img [src]="p.bg" />
    </div>
  </div>

  <!-- Dots -->
  <div class="dots">
    <span
      *ngFor="let promotiom of promotions; let i = index"
      class="dot"
      [class.active]="i === active"
      (click)="go(i)"
    ></span>
  </div>
</div>
